name: cms-dg

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must contain the immutable production image tag}
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ROOT:-/opt/cms-dg}/shared/.env
    environment:
      RAILS_ENV: production
      DATABASE_HOST: postgres
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:80"
    volumes:
      - storage:/rails/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ROOT:-/opt/cms-dg}/shared/.env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
    name: cms_dg_postgres_data
  storage:
    name: cms_dg_storage
