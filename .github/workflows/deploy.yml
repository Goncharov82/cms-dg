name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_HOST: 78.24.217.140
  SERVER_PORT: "22"
  SERVER_USER: test.goncharoff.pro
  DEPLOY_ROOT: /var/www/test.goncharoff.pro/data/app

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: goncharoff_pro_test
          POSTGRES_USER: goncharoff
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goncharoff -d goncharoff_pro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      RAILS_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: goncharoff
      DATABASE_PASSWORD: test_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install image library
        run: sudo apt-get update && sudo apt-get install -y libvips-tools

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Rails tests
        run: bin/rails db:prepare test

      - name: Create release archive
        run: git archive --format=tar.gz --output="release-${GITHUB_SHA}.tar.gz" HEAD

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/test_goncharoff_pro_deploy
          chmod 600 ~/.ssh/test_goncharoff_pro_deploy
          printf '%s\n' '78.24.217.140 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINTub0ZDAUw2Gc2MOWbHGpjZY4hJ91QR4UU6mjvEwBAr' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          ssh -p "$SERVER_PORT" -i ~/.ssh/test_goncharoff_pro_deploy \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$DEPLOY_ROOT/incoming'"
          scp -P "$SERVER_PORT" -i ~/.ssh/test_goncharoff_pro_deploy \
            "release-${GITHUB_SHA}.tar.gz" \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_ROOT/incoming/"
          scp -P "$SERVER_PORT" -i ~/.ssh/test_goncharoff_pro_deploy \
            ops/native-deploy.sh \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_ROOT/native-deploy.sh"

      - name: Deploy release
        run: |
          ssh -p "$SERVER_PORT" -i ~/.ssh/test_goncharoff_pro_deploy \
            "$SERVER_USER@$SERVER_HOST" \
            "chmod 700 '$DEPLOY_ROOT/native-deploy.sh' && \
             APP_ROOT='/var/www/test.goncharoff.pro/data/site' \
             '$DEPLOY_ROOT/native-deploy.sh' \
             '${GITHUB_SHA}' \
             '$DEPLOY_ROOT/incoming/release-${GITHUB_SHA}.tar.gz'"
